# configs/trainers/HiCroPL/hicropl_seg.yaml
#
# HiCroPL semantic segmentation config (CLIP semantics + prompt learning + DeepLabV3 head inline in trainer)
#
# This is meant to work with:
#   - trainers/hicropl_seg.py   (TRAINER.NAME = HiCroPL_Seg)
#   - datasets/lulc_seg.py
#   - dassl/data/transforms/seg_transforms.py
#
# IMPORTANT:
# - For segmentation you usually want larger crops than 224. Start with 384 or 448 if VRAM allows.
# - ViT-B/16 requires sizes divisible by 16 for clean token grid.

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 15       # adjust to your GPU (segmentation is heavier than classification)
  TEST:
    BATCH_SIZE: 4
  NUM_WORKERS: 4

INPUT:
  # For train: we will use random_resized_crop to this crop size
  SIZE: (224, 224)
  CROP_SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD:  [0.26862954, 0.26130258, 0.27577711]
  # RRCROP_SCALE: (0.8, 1.0)
  # RRCROP_RATIO: (0.75, 1.3333333)

  # Optional multi-scale range for "random_resize" if you add it; otherwise ignored
  # SCALE_RANGE: (0.5, 2.0)

  # Paired seg transform keywords (handled by build_seg_transform)
  TRANSFORMS: ["random_resized_crop", "random_flip", "normalize"]

OPTIM:
  NAME: "adam"
  LR: 0.0005              # seg tends to need smaller LR than cls; tune
  MAX_EPOCH: 80
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5
  EPS: 1e-3
  WEIGHT_DECAY: 0.0
  PROMPT_LR_MULT: 1.0

TRAIN:
  PRINT_FREQ: 20
  CHECKPOINT_FREQ: 10

TEST:
  NO_TEST: False
  FINAL_MODEL: "best_val"  # use val mIoU to select best

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  NAME: "HiCroPL_Seg"
  # Original HiCroPL hyperparameters (kept intact)
  HICROPL:
    N_CTX: 16
    CROSS_LAYER: 6
    CTX_INIT: "a photo of a"
    PREC: "amp"           # "fp16" | "fp32" | "amp"
    PROMPT_DEPTH: 12
    TEACHER_NAME: "ViT-B/16"
    LAMBD: 12.0
    # CTX_INIT_MODE: "classdef"          # "default" | "classdef"
    # CTX_INIT_CLASSDEF_FILE: "gpt_file/lulc_seg_prompt.json"
    # CTX_INIT_BLEND: 1.0                # 1.0=use classdef init fully, 0.5=mix with old init 

  # Segmentation-specific knobs used by trainers/hicropl_seg.py (optional)
  HICROPL_SEG:
    PATCH_SIZE: 16         # ViT-B/16
    ASPP_CHANNELS: 256
    ATROUS_RATES: (1, 2, 4)
    LOSS: ce_dice
    CE_WEIGHT: 1.0
    DICE_WEIGHT: 1.0
    DICE_EPS: 1e-6
    # Optional (leave empty for now):
    CLASS_WEIGHTS: ()

    # USE_DESC: True
    USE_DESC: False
    DESC_W: 0.1
    DESC_BANK: "data/bing_rgb/desc_emb_bank.pt"

    # # Per-image metadata text alignment (teacher from metadata.json)
    # USE_META: True
    # # META_W: 0.1
    # META_BANK: "data/bing_rgb/meta_num_bank.pt"
    # META_HIDDEN: 256

    # Metadata as per-image text input (Option A: shared delta for all classes)
    USE_META_TEXT: False
    META_TEXT_BANK: "data/bing_rgb/meta_token_bank.pt"
    META_TEXT_ALPHA: 1.0
    META_TEXT_HIDDEN: 256  

    USE_CLASS_DESC: False
    # USE_CLASS_DESC: True
    CLASS_DESC_ALPHA: 2.0
